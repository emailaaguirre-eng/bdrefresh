name: a11y-smoke
on:
  workflow_dispatch:
  push:
    branches: [master, main, "rescue/**"]
jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Axe smoke against production
        env:
          A11Y_BASE_URL: https://banddservicing.com
        run: npm run a11y:smoke
