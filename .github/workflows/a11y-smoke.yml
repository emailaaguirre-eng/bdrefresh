name: a11y-smoke
on:
  workflow_dispatch:
  push:
    branches: [master, main, "rescue/**"]
jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Axe smoke against production
        env:
          A11Y_BASE_URL: https://banddservicing.com
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run a11y:smoke
