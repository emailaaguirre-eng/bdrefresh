<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent - B&D Servicing LLC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#080c12;color:#e4eaf2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
        .card{text-align:center;max-width:520px;width:100%}
        .icon{width:72px;height:72px;border-radius:50%;background:rgba(46,196,162,.12);display:inline-flex;align-items:center;justify-content:center;margin-bottom:24px}
        .icon svg{color:#2ec4a2}
        h1{font-size:1.75rem;font-weight:700;margin-bottom:12px}
        p{color:#8a9bb5;line-height:1.6;margin-bottom:24px;font-size:1rem}
        .btn{display:inline-block;padding:12px 28px;border-radius:8px;background:linear-gradient(135deg,#2568a0,#3a8fd4);color:#fff;text-decoration:none;font-weight:600;font-size:.95rem;transition:opacity .2s}
        .btn:hover{opacity:.85}
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <h1>Message Sent!</h1>
        <p>Thank you for reaching out. We will review your message and get back to you within 24 hours.</p>
        <a href="/" class="btn">Back to Home</a>
    </div>
</body>
</html>
