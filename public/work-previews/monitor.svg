<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Illustrative monitoring dashboard UI">
  <defs>
    <style type="text/css"><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700&display=swap');
.t { font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; }
]]></style>
    <linearGradient id="m-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="m-chart" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="#070a0f"/>
  <rect x="12" y="12" width="616" height="336" rx="14" fill="url(#m-bg)" stroke="#243044" stroke-width="1"/>
  <text class="t" x="32" y="44" font-size="13" font-weight="700" fill="#e8edf4">Environment Overview</text>
  <text class="t" x="32" y="64" font-size="10" font-weight="400" fill="#6b7a8f">Last updated just now · Sample preview</text>
  <rect x="528" y="30" width="62" height="15" rx="7" fill="#1c2636" stroke="#3b82f6" stroke-opacity="0.45" stroke-width="1"/>
  <text class="t" x="559" y="37.5" font-size="6.5" font-weight="600" fill="#93c5fd" text-anchor="middle" dominant-baseline="central">Export</text>
  <rect x="596" y="30" width="22" height="15" rx="2" fill="#1c2636" stroke="#475569" stroke-width="1"/>
  <text class="t" x="607" y="37.5" font-size="6.5" font-weight="600" fill="#94a3b8" text-anchor="middle" dominant-baseline="central">1h</text>
  <g transform="translate(24, 80)">
    <rect width="184" height="78" rx="0" fill="#141b26" stroke="#2f3d52"/>
    <text class="t" x="14" y="26" font-size="10" font-weight="600" fill="#8b9cb3">Uptime</text>
    <text class="t" x="14" y="54" font-size="22" font-weight="700" fill="#4ade80">99.98%</text>
    <rect x="204" y="0" width="184" height="78" rx="12" fill="#141b26" stroke="#2f3d52"/>
    <text class="t" x="218" y="26" font-size="10" font-weight="600" fill="#8b9cb3">Latency</text>
    <text class="t" x="218" y="54" font-size="22" font-weight="700" fill="#f1f5f9">142ms</text>
    <rect x="408" y="0" width="184" height="78" rx="0" fill="#141b26" stroke="#2f3d52"/>
    <text class="t" x="422" y="26" font-size="10" font-weight="600" fill="#8b9cb3">Healthy checks</text>
    <text class="t" x="422" y="54" font-size="22" font-weight="700" fill="#38bdf8">24</text>
  </g>
  <rect x="24" y="172" width="592" height="128" rx="4" fill="#141b26" stroke="#2f3d52"/>
  <text class="t" x="40" y="198" font-size="11" font-weight="700" fill="#cbd5e1">Response time</text>
  <path d="M48 268 L120 232 L200 248 L280 200 L360 220 L440 180 L520 208 L592 188 L592 280 L48 280 Z" fill="url(#m-chart)"/>
  <path d="M48 268 L120 232 L200 248 L280 200 L360 220 L440 180 L520 208 L592 188" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="24" y1="308" x2="616" y2="308" stroke="#2f3d52"/>
  <text class="t" x="40" y="328" font-size="9" font-weight="400" fill="#6b7a8f">Environments: Production · Staging · Development</text>
  <rect x="32" y="336" width="568" height="8" rx="0" fill="#1c2636"/>
  <rect x="32" y="336" width="424" height="8" rx="0" fill="#22c55e" fill-opacity="0.28"/>
</svg>
