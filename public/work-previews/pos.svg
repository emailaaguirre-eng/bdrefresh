<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Illustrative restaurant POS and kitchen display">
  <defs>
    <style type="text/css"><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap');
.t { font-family: 'Rubik', system-ui, sans-serif; }
]]></style>
    <linearGradient id="p-kds" x1="0%" y1="0%" x2="0%" y2="100%">
